# agentorc's own answer to how `main` becomes what is running (design §5 `promote:`, §6 *Promote*;
# TD-132 slice 4). The home runs both in this checkout. `run` is CLAUDE.md's promote pair: it
# rebuilds the live venv from this checkout and replaces the client and the host agent together,
# which restarts the agent that started it (sessions live in tmux and survive it). `check` prints
# the commit the live install was built from, or fails saying why. Whether the home promotes on
# its own is `auto`, the Settings page's switch (`settings.yml`), never this file.
promote:
  run: V="$HOME/.local/share/agentorc-venv/bin"; "$V/pip" install --upgrade "$(pwd -P)[ui]" && "$V/ao" service install
  check: >-
    "$HOME/.local/share/agentorc-venv/bin/python" -c 'import sys; from sessionorc import build;
    c = build.info().get("commit"); print(c) if c else sys.exit("build unknown: the live install carries no build record")'

# The paths a PR must have read before it merges (design §4.9c *What is the repo's: `held:`*; TD-310):
# the host agent's package and the briefs. Under a flow every review stage holds them, whoever wrote
# the PR; a team with no flow reads a role's own `review:`, and this file writes none.
held: ["src/sessionorc/**", "docs/briefs/**"]

# The ao-grind team, defined in the repo it works (design §4.9 *The org is an aggregate*; TD-229
# slice 2), on flows since TD-310 (design §4.9c): `td` — design → build → review — is its default,
# `build-review` the switch when no design is wanted (`ao team flow ao-grind build-review`). The flow
# fills what the definition used to write — each member's lane, `entries.feature`, the roles' `review:`
# — so none of those is written here (`ao org check` names any that comes back). While
# `~/.agentorc/org.yml` still defines `ao-grind` it wins the name and this one reads *shadowed by
# org.yml*; removing the team from the org file is the switch. The profiles stay the org file's
# `roles:` overlay (the install's word), and no `host:` — where a repo's team lands is the org's `place:`.
teams:
  ao-grind:
    flows: [td, build-review]
    manager: {role: manager, name: manager-ao-1, brief: docs/briefs/manager-ao-1.md}
    techlead: {name: techlead-ao-1, context: docs/briefs/techlead-context.md}
    # seats with a trigger (design §4.9b, TD-098): auditors that file what the last PRs left in the
    # docs and the tests, and never fix it; each fills after ten merged PRs, so an idle week costs nothing
    seats:
      - {name: docs-audit-ao-1, role: auditor, brief: docs/briefs/docs-audit.md, trigger: {prs: 10}}
      - {name: test-audit-ao-1, role: auditor, brief: docs/briefs/test-audit.md, trigger: {prs: 10}}
    members:
      - {role: grinder, name: grinder-ao-1, brief: docs/briefs/grinder-ao-1.md}
      # the page and git lane, apart from the host agent: the split is by file and lives in its brief
      - {role: grinder, name: grinder-ao-2, brief: docs/briefs/grinder-ao-2.md}
      # the design stage's member; what the person sees of a design is its own call (design §4.8)
      - {role: designer, name: designer-ao-1, unattended: true}

# The repo's part of each role's brief (design §4.8 `{repo}`): the grinders' and the manager's are
# named on the team above; the designer's is the preset's supplement, its mechanics the package's
# `designer.md` (design §4.9c *The designer gets a template*).
roles:
  designer:
    brief: docs/briefs/designer-ao-1.md
  # a one-week trial of a 200k bound on the grinders, from 2026-10-08 (Paul's decision on TD-378's ADR,
  # docs/decisions/2026-10-08-prompt-cache.md option 4): the anchor reads usage per merged PR against the
  # week before, and the line stays or goes (TD-460)
  grinder:
    context: {bound: 200k}
