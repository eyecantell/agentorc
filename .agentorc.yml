# agentorc's own answer to how `main` becomes what is running (design §5 `promote:`, §6 *Promote*;
# TD-132 slice 4). The home runs both in this checkout. `run` is CLAUDE.md's promote pair: it
# rebuilds the live venv from this checkout and replaces the client and the host agent together,
# which restarts the agent that started it (sessions live in tmux and survive it). `check` prints
# the commit the live install was built from, or fails saying why. Whether the home promotes on
# its own is `auto`, the Settings page's switch (`settings.yml`), never this file.
promote:
  run: V="$HOME/.local/share/agentorc-venv/bin"; "$V/pip" install --upgrade "$(pwd -P)[ui]" && "$V/ao" service install
  check: >-
    "$HOME/.local/share/agentorc-venv/bin/python" -c 'import sys; from sessionorc import build;
    c = build.info().get("commit"); print(c) if c else sys.exit("build unknown: the live install carries no build record")'

# The ao-grind team, defined in the repo it works (design §4.9 *The org is an aggregate*; TD-229
# slice 2): the org file's definition as it stood on 2026-10-03 (its `entries:` and `owner:` lanes
# included), the names, lanes, briefs and techlead seat unchanged. While `~/.agentorc/org.yml` still defines `ao-grind` it wins the name and
# this one reads *shadowed by org.yml*, so no team start changes; removing the team from the org
# file is the switch. The roles below equal the org overlay's `review:`; read without the overlay (the
# New session form's role list) `designer` is now a role of this repo, where it was unknown. The profiles stay the org file's `roles:` overlay (the install's word), and
# no `host:` — where a repo's team lands is the org's `place:`.
teams:
  ao-grind:
    manager: {role: manager, name: manager-ao-1, brief: docs/briefs/manager-ao-1.md}
    techlead: {name: techlead-ao-1, context: docs/briefs/techlead-context.md}
    # Add entry's Open a session (TD-180, Paul 2026-09-28): a feature starts an interactive designer,
    # every other type a techlead
    entries: {feature: designer}
    members:
      - {role: grinder, name: grinder-ao-1, lane: [free-pick, "owner:grinder"], brief: docs/briefs/grinder-ao-1.md}
      # the page and git lane, apart from the host agent: the split is by file and lives in its brief
      - {role: grinder, name: grinder-ao-2, lane: [free-pick, "owner:grinder"], brief: docs/briefs/grinder-ao-2.md}
      # its lane is the ledger's design-first entries; it decides what Paul sees (design §4.8)
      - {role: designer, name: designer-ao-1, unattended: true, lane: [design-first, "owner:designer"]}

# A repo's held paths are the repo's (design §4.9, TD-209): `review:` whole on the role, the last
# layer of a preset, so `src/sessionorc/**` is never carried into another repo by an org-wide role.
# A grinder's or the designer's PR on these paths waits for the techlead seat's read (§4.9b).
roles:
  grinder:
    review: {reader: techlead, held: ["src/sessionorc/**", "docs/briefs/**"]}
  designer:
    brief: docs/briefs/designer-ao-1.md
    review: {reader: techlead, held: ["src/sessionorc/**", "docs/briefs/**"]}
