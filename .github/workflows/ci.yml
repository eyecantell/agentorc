name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true
      - name: Install tmux
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      - name: Install
        run: pdm sync -G ui -G dev
      - name: Lint
        run: pdm run lint
      - name: Test
        run: pdm run test
        env:
          # the pty bridge tests need a terminal-ish environment
          TERM: xterm-256color
