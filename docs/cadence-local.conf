# docs/cadence-local.conf — this repo's opt-outs from the cadence (TD-072). Consumer-owned:
# sync.sh creates it once and never overwrites it; sync.sh, sync.sh --verify and sync-all.sh read it.
#
# One opt-out per line; the first word after the colon is the value, the rest names the
# decision — the ADR that made it. Nothing uncommented here means the whole cadence is adopted.
#
#   not-adopted: §4 — docs/decisions/0001-cadence-home.md
#       §4 (branch → PR → squash) is not how this repo works: scripts/git-hooks/pre-push is
#       neither shipped nor locked (an unedited copy is removed; an edited one is kept, with a
#       WARN), no pre-push shim is installed (an existing one is removed either way),
#       and sync-all.sh pushes its sync branch for the owner to merge instead of opening a PR.
#   skip-seed: docs/claude-memory/MEMORY.md — docs/decisions/0001-cadence-home.md
#       that SEED file is never created (one that exists is left alone — it is yours).
#
# --verify reports each as OPTED-OUT, never MISSING. See cadence.md, Adoption checklist.
