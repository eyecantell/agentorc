[project]
name = "agentorc"
version = "0.0.1"
description = "Orchestrate interactive AI coding-agent sessions and shells running in tmux across hosts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "jinja2>=3.1",
    "ptyprocess>=0.7",
    "python-multipart>=0.0.9",
]

[project.scripts]
agentorc = "agentorc.cli:main"
ao = "agentorc.cli:main"
agentorc-agent = "sessionorc.agent:main"
agentorc-hook = "agentorc.adapters.claude_code.hook:main"
agentorc-ui = "agentorc.ui.app:main"

[project.entry-points."agentorc.adapters"]
claude-code = "agentorc.adapters.claude_code:ClaudeCodeAdapter"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/sessionorc", "src/agentorc"]
source-includes = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pdm.scripts]
test = "pytest -q"
lint = "ruff check src tests"
fmt = "ruff format src tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scripts", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
