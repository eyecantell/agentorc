[project]
name = "agentorc"
version = "0.0.1"
description = "Orchestrate interactive AI coding-agent sessions and shells running in tmux across hosts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "jinja2>=3.1",
    "ptyprocess>=0.7",
    "python-multipart>=0.0.9",
]

[project.scripts]
agentorc = "agentorc.cli:main"
ao = "agentorc.cli:main"
agentorc-agent = "sessionorc.agent:main"
agentorc-hook = "agentorc.adapters.claude_code.hook:main"
agentorc-ui = "agentorc.ui.app:main"

[project.entry-points."agentorc.adapters"]
claude-code = "agentorc.adapters.claude_code:ClaudeCodeAdapter"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
includes = ["src/sessionorc", "src/agentorc"]
source-includes = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # A hung test is worth less than a failing one: it dies at the job level with no output at
    # all — 26 minutes on PR #192, unattributed to this day, and 14 minutes on 2026-09-20. With
    # this, it fails in the file that hung, with every thread's stack (TD-063).
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pdm.scripts]
test = "pytest -q"
test-fast = "pytest -q -m unit"
lint = "ruff check src tests"
fmt = "ruff format src tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# **A hang must fail, and say where** (TD-063, TD-078). Twice a job has died with no output at
# all: 26 minutes on PR #192, unattributed to this day, and 14 minutes on 2026-09-20 whose last
# line was the test *before* the one that hung. A per-test bound turns that into an ordinary
# failure, in the right file, and `thread` dumps every thread's stack — which is the only
# evidence a wait with no bound ever leaves. 120 s is far above the slowest test here (the link
# and restart files run whole in about 11 s) and far below a CI job's patience.
timeout = 120
timeout_method = "thread"
markers = [
    "unit: no tmux, sockets, or subprocesses; sub-second",
    "integration: spawns tmux, a host agent, git, or the hook script",
]
filterwarnings = [
    # TD-007 (archived): starlette's TestClient keeps a portal thread alive, so ptyprocess's
    # forkpty() in the /term tests runs in a multi-threaded process. The child only execs, the
    # exposure is accepted; see tests/README.md "Real-environment dependencies".
    "ignore:This process .* is multi-threaded, use of forkpty\\(\\) may lead to deadlocks:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scripts", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
