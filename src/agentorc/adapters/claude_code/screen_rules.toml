# Screen rules for Claude Code (design §4.2, TD-015): the labelled scraped fallback for what no
# hook reports. Evaluated over the bottom of the pane; the highest priority match wins; the
# verdict is written with confidence "scraped" and never outranks a fresh hook state.
# Patterns are case-insensitive regular expressions. `pending.text = "$line"` uses the matched line.
tool = "claude-code"
version = 1

[[rules]]
# The first-run "trust this folder?" dialog: no hook fires until it is answered (§4.2 quirk).
id = "trust-dialog"
state = "needs-you"
priority = 100
region = 15
any = ["Do you trust the files in this folder"]
all = ["Yes, proceed|No, exit"]  # the dialog's own options: the question alone could be someone's prose
pending = { kind = "question", text = "trust this folder? (answer in the terminal)" }

[[rules]]
# The tool's own limit message (the ADR's three usage-limit screens), before TD-001's poll sees it.
id = "usage-limit"
state = "limited"
priority = 90
any = ["usage limit reached", "hit your usage limit", "You.ve hit your (usage|weekly) limit"]
pending = { kind = "limit", text = "$line" }

[[rules]]
id = "rate-limited-429"
state = "limited"
priority = 80
all = ["\\b429\\b"]
any = ["rate.?limit", "retry", "overloaded", "too many requests"]
pending = { kind = "limit", text = "$line" }

[[rules]]
# A Remote Control takeover: another device connected to this session and Claude Code stood this one
# down, so the pane is alive and nothing is driving it. It happened to an unattended worker on
# 2026-09-10 and left it `idle` for 20 h with its PR unmerged (TD-032) — `idle` is the resting state
# of a session waiting on a person, which is exactly what this is not.
# Only the banner's two unambiguous markers are read: the close code and the footer. Two reviews of
# PR #125 killed the looser forms — `any` and `all` may match *different* lines, and even within one
# line a pair of phrases joined by `.*` fires on a sentence *about* a stand-down ("when remote
# control disconnected … the pane kept standing down"), which is what a review comment or an
# unwrapped paragraph of this repo's own docs looks like.
# A pane displaying the banner *verbatim* still reads as the banner; so does the usage-limit rule
# for its message. Reading the pane is what a screen rule is, and what bounds it is that a scraped
# verdict never outranks a fresh hook (§4.2) — a session reading a file is reporting hooks.
# Priority below `rate-limited-429`: a pane that is also rate limited has the more actionable answer.
id = "remote-control-standdown"
state = "stalled?"
priority = 70
region = 20
any = [
  "stand(s|ing)? down \\(code \\d+\\)",
  "/rc failed\\s*$",
]
pending = { kind = "note", text = "stood down: another device took over this session" }
