# Screen rules for Claude Code (design §4.2, TD-015): the labelled scraped fallback for what no
# hook reports. Evaluated over the bottom of the pane; the highest priority match wins; the
# verdict is written with confidence "scraped" and never outranks a fresh hook state.
# Patterns are case-insensitive regular expressions. `pending.text = "$line"` uses the matched line.
tool = "claude-code"
version = 1

[[rules]]
# The first-run "trust this folder?" dialog: no hook fires until it is answered (§4.2 quirk).
id = "trust-dialog"
state = "needs-you"
priority = 100
region = 15
any = ["Do you trust the files in this folder"]
all = ["Yes, proceed|No, exit"]  # the dialog's own options: the question alone could be someone's prose
pending = { kind = "question", text = "trust this folder? (answer in the terminal)" }

[[rules]]
# A message from another Claude session through the tool's own peer channel, held because the two
# sessions' permission-mode classes differ (TD-102): Claude Code draws a "Held message from another
# session" panel with a two-item menu and waits, no hook fires for it, and the session read as
# `idle (hook)` while its composer was blocked (samscrape's manager, 2026-09-22). Deliver or deny
# is a person's call — §9 invariant 6: the core never types a menu choice into a pane.
# The panel's heading sits more than TAIL_LINES above the menu once the message preview is drawn,
# so the rule keys on the two menu lines, each anchored to its whole line: the options quoted in
# prose (the ledger, the design, this comment) never start a line and never end one.
# Priority just under the trust dialog: while the panel is up nothing else on the screen can be acted on.
id = "held-peer-message"
state = "needs-you"
priority = 95
region = 15
all = ["^\\s*(❯\\s*)?(\\d+\\.\\s*)?Deny\\W+drop it and tell the sender it was declined\\s*$"]
any = ["^\\s*(❯\\s*)?(\\d+\\.\\s*)?Deliver this message to Claude\\s*$"]
pending = { kind = "question", text = "held message from another session (deliver or deny in the terminal)" }

[[rules]]
# The tool's own limit message (the ADR's three usage-limit screens), before TD-001's poll sees it.
id = "usage-limit"
state = "limited"
priority = 90
any = ["usage limit reached", "hit your usage limit", "You.ve hit your (usage|weekly) limit"]
pending = { kind = "limit", text = "$line" }

[[rules]]
id = "rate-limited-429"
state = "limited"
priority = 80
all = ["\\b429\\b"]
any = ["rate.?limit", "retry", "overloaded", "too many requests"]
pending = { kind = "limit", text = "$line" }

[[rules]]
# A Remote Control takeover: another device connected to this session and Claude Code stood this one
# down, so the pane is alive and nothing is driving it. It happened to an unattended worker on
# 2026-09-10 and left it `idle` for 20 h with its PR unmerged (TD-032) — `idle` is the resting state
# of a session waiting on a person, which is exactly what this is not.
#
# BOTH markers are required — the close code (`all`) and the `/rc` failure (`any`) — because three
# reviews of PR #125 broke every looser form in turn: `any` and `all` may match *different* lines,
# so a pair of loose phrases fires on a screen that merely mentions both; two phrases joined by `.*`
# fire on one line of prose *about* a stand-down; and each marker alone is ordinary text elsewhere —
# a boot script reports a failed rc file, and any circuit breaker stands down with a numeric code.
# The pair is what the one observed incident showed, and nothing else plausibly carries both.
# The footer marker is anchored to the end of its line, which is where a pane's footer puts it and
# where prose about the rule never does — including this comment, the entry and the tests, each of
# which would otherwise have tripped the rule it documents (found by the fourth PR #125 review).
# The cost is a stand-down showing only one of them, which would be missed — the right way round for
# a scraped rule, and the cheap half to loosen once someone captures a real pane: this is written
# from a sentence quoted in TD-032, not from a screen anyone saved.
# A pane displaying the banner *verbatim* reads as the banner, as it does for the usage-limit rule;
# what bounds that is §4.2's rule that a scraped verdict never outranks a fresh hook, and a session
# reading a file is reporting hooks.
# Priority below `rate-limited-429`: a pane that is also rate limited has the more actionable answer.
id = "remote-control-standdown"
state = "stalled?"
priority = 70
region = 20
all = ["stand(s|ing)? down \\(code \\d+\\)"]
any = ["/rc failed\\s*$"]
pending = { kind = "note", text = "stood down: another device took over this session" }
